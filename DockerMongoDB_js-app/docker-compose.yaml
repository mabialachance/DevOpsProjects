# Docker Compose file defining a 3-container stack:
# the app, its MongoDB database, and a web UI for managing the database

services:
 # --- Application container ---
  my-app:
    image: 192.168.4.74:8083/my-app:1.0                  # Pulled from the private Nexus Docker registry (host:port/image:tag)
    ports:
     - 3000:3000                                         # HOST_PORT:CONTAINER_PORT, app reachable at localhost:3000
  mongodb:
    image: mongo                                          # Official MongoDB image from Docker Hub (defaults to the latest tag)
    ports:
     - 27017:27017                                        # Default MongoDB port exposed to the host
    environment:
     - MONGO_INITDB_ROOT_USERNAME=admin                   # Creates the root admin user on first startup
     - MONGO_INITDB_ROOT_PASSWORD=password                # Root password (use secrets or an .env file in real setups)
    volumes:
     - mongo-data:/data/db                                # Named volume so data survives container restarts/removal

 # --- Database admin UI container ---
  mongo-express:
    image: mongo-express                                   # Web-based MongoDB admin interface
    restart: always                                        # Restart automatically if it crashes or Docker restarts
    ports:
     - 8081:8081                                           # Web UI reachable at localhost:8081
    environment:
     - ME_CONFIG_MONGODB_URL=mongodb://admin:password@mongodb:27017  # Connection string; "mongodb" is the service name, resolved via Docker's internal DNS
     - ME_CONFIG_BASICAUTH_USERNAME=chancemab               # Login username for the Mongo Express web page
     - ME_CONFIG_BASICAUTH_PASSWORD=password                # Login password for the Mongo Express web page
    depends_on:
     - "mongodb"                                            # Start mongodb container first (controls start order only, not readiness)

# --- Named volumes ---
volumes:
  mongo-data:                                               # Declares the volume used by the mongodb service
    driver: local                                           # Stored on the local Docker host (the default driver)
