services:
  my-app:
    image: 192.168.4.74:8083/my-app:1.0 # Pull from nexus private repository
    ports:
     - 3000:3000
  mongodb:
    image: mongo
    ports:
     - 27017:27017
    environment:
     - MONGO_INITDB_ROOT_USERNAME=admin
     - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
     - mongo-data:/data/db
  mongo-express:
    image: mongo-express
    restart: always
    ports:
     - 8081:8081
    environment:
     - ME_CONFIG_MONGODB_URL=mongodb://admin:password@mongodb:27017
     - ME_CONFIG_BASICAUTH_USERNAME=chancemab
     - ME_CONFIG_BASICAUTH_PASSWORD=password
    depends_on:
     - "mongodb"
volumes:
  mongo-data:
    driver: local
