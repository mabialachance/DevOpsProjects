# Docker Compose file defining a 3-container stack:
# the app, its MongoDB database, and a web UI for managing the database
services:
  my-app:
    container_name: my-app
    #image: 192.168.4.74:8083/my-app:1.0                  # Pulled from the private Nexus Docker registry (host:port/i>
    build: .                      # builds from the Dockerfile in this folder
    restart: on-failure           # retry if MongoDB isn't ready yet
    ports:
      - 3000:3000
    environment:
      - MONGO_DB_USERNAME=${MONGO_ROOT_USER}
      - MONGO_DB_PWD=${MONGO_ROOT_PASSWORD}
    depends_on:
      - mongodb
  mongodb:
    image: mongo                                          # Official MongoDB image from Docker Hub (defaults to the latest tag)
    ports:
      - 27017:27017                                        # Default MongoDB port exposed to the host
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}         # Read from .env
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}     # Read from .env

    volumes:
      - mongo-data:/data/db                                # Named volume so data survives container restarts/removal

  # --- Database admin UI container ---
  mongo-express:
    image: mongo-express                                   # Web-based MongoDB admin interface
    restart: always                                        # Restart automatically if it crashes or Docker restarts
    ports:
      - 8081:8081                                           # Web UI reachable at localhost:8081
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_BASICAUTH_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_BASICAUTH_PASSWORD}
    depends_on:
      - "mongodb"                                            # Start mongodb container first (controls start order only, not readiness)

# --- Named volumes ---
volumes:
  mongo-data:                                               # Declares the volume used by the mongodb service
    driver: local                                           # Stored on the local Docker host (the default driver)
