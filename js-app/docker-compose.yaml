services:
  # my-app:
    # image: ${docker-registry}/my-app:1.0
    # ports:
     # - 3000:3000
  mongodb:
    image: mongo
    ports:
     - 27017:27017
    environment:
     - MONGO_INITDB_ROOT_USERNAME=chance
     - MONGO_INITDB_ROOT_PASSWORD=Gloire06
    volumes:
     - mongo-data:/data/db
  mongo-express:
    image: mongo-express
    restart: always
    ports:
     - 8081:8081
    environment:
     - ME_CONFIG_MONGODB_URL=mongodb://chance:Gloire06@mongodb:27017
     - ME_CONFIG_BASICAUTH_USERNAME=chancemab
     - ME_CONFIG_BASICAUTH_PASSWORD=Gloire06
    depends_on:
     - "mongodb"
volumes:
  mongo-data:
    driver: local
