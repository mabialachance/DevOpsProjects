
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk25
    container_name: jenkins
    restart: unless-stopped

    ports:
      - "${JENKINS_PORT}:8080"
      - "50000:50000"

    env_file:
      - .env

    volumes:
      # Persistent Jenkins data
      - jenkins_home:/var/jenkins_home

      # Jenkins initialization scripts
      - ./init.groovy.d:/var/jenkins_home/init.groovy.d:ro

      # Optional: Docker host socket
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
    name: jenkins_jenkins_data

